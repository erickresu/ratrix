<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rate management for freight teams.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ratrix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ratrix</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- AI chatbot widget (wyred.tech) — renders its own floating bubble via
       an iframe on its own domain, so it isn't part of the Flutter widget
       tree at all. Web-only: nothing else can run a <script> embed. -->
  <script src="https://chat.wyred.tech/embed.js" data-base-url="https://chat.wyred.tech" data-api-url="https://api.chat.wyred.tech" data-project="52e73789-ad6d-4a37-97bb-7d35cacc6fe5" data-key="pk_live_P9DbOhKSj3IOOH0r7LFHpkKCtcZgSjqI"></script>

  <!-- Lets Flutter hide the wyred chat bubble on screens where it shouldn't
       show (e.g. login, or while the app tour is running). embed.js
       (chat.wyred.tech) appends two separate elements to <body>: the
       visible bubble/launcher/greeting in `#samantha-widget-container`
       (this is the one actually visible at rest — toggled below), and the
       chat panel itself in `#samantha-widget-iframe` (already
       `display:none` by default, only shown once the user opens it — left
       alone here so restoring visibility doesn't force it open). An
       earlier version of this guessed the widget's mount point as
       "whatever new direct child of body shows up first," which bound to
       the iframe (appended before the container) and left the actually-
       visible bubble uncontrolled — hiding it did nothing. Targeting the
       container's known id directly is reliable regardless of append
       order. -->
  <script>
    window.RatrixChat = (function () {
      var containerId = 'samantha-widget-container';
      var pending = false; // hidden until Flutter says otherwise (login/splash default)

      function apply() {
        var el = document.getElementById(containerId);
        if (el) el.style.display = pending ? '' : 'none';
      }

      // embed.js's <script> tag runs after this one, so the container
      // doesn't exist yet on first `apply()` — re-apply whenever body
      // gains a child until it's found, then stop watching.
      var observer = new MutationObserver(function () {
        apply();
        if (document.getElementById(containerId)) observer.disconnect();
      });
      observer.observe(document.body, { childList: true });

      function setVisible(visible) {
        pending = visible;
        apply();
      }
      return { setVisible: setVisible };
    })();
  </script>
</body>
</html>
